name: Build Flutter APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
          cache: true

      - name: Create fresh Flutter project structure
        run: |
          # Создаем чистый проект, чтобы появились папки android/ и конфиги
          flutter create . --org com.vector.app --project-name vector_flow_studio --platforms=android

      - name: Overwrite main.dart with custom code
        run: |
          # Если твой файл main.dart лежит в корне или где-то еще, убедись, что он на месте, 
          # либо скопируй его в lib/main.dart (если он уже в репозитории, шаг checkouts его сохранит).
          ls -la lib/

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK Release
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          
